        <h1>INKTROPE — Işıklı 2D &amp; 2.5D Animasyon Masası</h1>
        <p>El çizimini yapay zekâyla yeniden çizmeden tek tuşla canlandır, A4 kâğıt defterini tara, 360° 2.5D çoklu açı bağla ya da 1–6 oyunculu mini film yönet. Hesapsız, reklamsız ve ücretsiz tarayıcı animasyon stüdyosu.</p>
        <h2>Öne Çıkan Özellikler</h2>
        <ul>
          <li><strong>%100 El Çizimi Koruma:</strong> Orijinal kalem ve mürekkep çizimlerini yeniden üretmeden yumuşak iskeletle doğrudan canlandırır.</li>
          <li><strong>7 Evrensel Yaratık İskeleti:</strong> İki ayaklı, dört ayaklı, kanatlı, yılan/ahtapot, örümcek, kafa-bacak ve araç/nesne karakterleri otomatik tanır.</li>
          <li><strong>360° 2.5D Çoklu Açı &amp; A4 Çoklu Poz Bölücü:</strong> Ön, yan ve arka çizimlerini tek bir 2.5D karakterde birleştirir.</li>
          <li><strong>1–6 Oyunculu Mini Film &amp; Canlı Kukla:</strong> Konuşan kuklalar, sahne yönetimi, MP4, GIF ve yazdırılabilir A4 flipbook PDF dışa aktarım.</li>
        </ul>
        <p>INKTROPE is a free, ad-free, browser-based 2D &amp; 2.5D hand-drawn animation studio with 7 universal creature rigs, 360° multi-angle turnaround, A4 flipbook scanning, talking puppets, and 1–6 actor mini film directing.</p>
